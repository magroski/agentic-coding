name: Research
description: Deep research needed before work can be defined. A spike.
labels: [research]
body:
  - type: input
    id: question
    attributes:
      label: Question
      placeholder: How do competitors handle this feature?
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Decision it informs
      placeholder: Whether to build sign-in with magic links or passwords.
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Timebox
      placeholder: 2 days
  - type: textarea
    id: output
    attributes:
      label: Output
      value: Findings as a comment, and the issues they lead to.
