name: Chore
description: Small maintenance or change.
labels: [chore]
body:
  - type: textarea
    id: change
    attributes:
      label: Change
      placeholder: "Change the accent color to #3B82F6."
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why
      placeholder: Brand refresh.
  - type: textarea
    id: when
    attributes:
      label: When
      description: Only for dated work. One line per date.
      placeholder: By 2026-12-15
